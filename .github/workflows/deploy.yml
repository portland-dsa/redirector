# Build the relocatable artifact on merge to main and deploy it. CI holds no
# runtime credentials; it reaches the box only as a short-lived tagged ephemeral
# Tailscale node, talking to a shell-less deploy user (deploy-redirector) whose
# forced command is itself the boundary.
#
# There is one instance and no staging. The deploy job binds the `production`
# GitHub environment, whose required-reviewers rule (if set) pauses every run for
# a human click before it touches the box.
name: deploy
on:
    push:
        branches: [main]
        # Only redeploy when an input to the artifact changes; an unrelated push to
        # main creates no run at all.
        paths:
            - "redirector/**"
            - "pyproject.toml"
            - "uv.lock"
            - "scripts/build_artifact.sh"
            - ".github/workflows/deploy.yml"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v6
            - name: Install uv
              uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
              with:
                  version: "0.11.16"
            - name: Test
              run: uv run --locked pytest
            - name: Build relocatable artifact
              run: bash scripts/build_artifact.sh
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: redirector-${{ github.sha }}
                  path: dist/redirector-${{ github.sha }}.tar.gz
                  if-no-files-found: error

    deploy:
        needs: build
        # Holds TS_OAUTH_*, DEPLOY_HOST, and DEPLOY_SSH_KEY. NOTE: required-reviewers is
        # a repo Settings -> Environments rule, NOT enforceable from this file; a freshly
        # auto-created environment has NO protection until it is set.
        environment: production
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: redirector-${{ github.sha }}
                  path: ./artifact
            - uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
              with:
                  oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
                  oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
                  tags: tag:ci-deploy
            - name: ship + activate + smoke check
              env:
                  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}       # deploy-redirector@<box-tailscale-name>
                  DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }} # private key; pubkey is the deploy user's forced-command key
              run: |
                  set -euo pipefail
                  SHA="${{ github.sha }}"
                  install -d -m 700 ~/.ssh
                  printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
                  chmod 600 ~/.ssh/deploy_key
                  ssh=(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new)
                  TAR="artifact/redirector-$SHA.tar.gz"
                  DIGEST="$(sha256sum "$TAR" | cut -d' ' -f1)"
                  "${ssh[@]}" "$DEPLOY_HOST" "upload $SHA $DIGEST" < "$TAR"
                  "${ssh[@]}" "$DEPLOY_HOST" "activate $SHA"
                  for i in $(seq 1 30); do
                    if [ "$("${ssh[@]}" "$DEPLOY_HOST" is-active)" = active ]; then echo ok; exit 0; fi
                    sleep 5
                  done
                  echo "redirector did not become active" >&2; exit 1
